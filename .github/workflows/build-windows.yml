name: Build Windows

"on":
  workflow_dispatch:
  push:
    branches: [main, windows]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Generate icon.ico from icon.png
        run: |
          python -m pip install --quiet pillow
          python scripts/make-win-icon.py
      - run: npm ci
      - run: npm run pack:win64
      - name: Zip the packaged app
        run: Compress-Archive -Path dist/CIKE-win32-x64 -DestinationPath CIKE-windows-x64.zip -Force
      - name: Show output
        run: Get-ChildItem dist/CIKE-win32-x64/CIKE.exe; Get-Item CIKE-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CIKE-windows-x64
          path: CIKE-windows-x64.zip
          retention-days: 30
